name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/chat-voice-video-calling
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configure persistent APK signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/ppa-talk-debug-new.jks
          test -s app/ppa-talk-debug-new.jks
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }

          echo "=== Keystore file diagnostics (no secrets printed) ==="
          stat -c 'Keystore size: %s bytes' app/ppa-talk-debug-new.jks
          sha256sum app/ppa-talk-debug-new.jks

          echo "=== Checking PKCS12 password and listing aliases ==="
          if ! keytool -list -keystore app/ppa-talk-debug-new.jks -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD"; then
            echo "DIAGNOSIS: PKCS12 could not be opened with ANDROID_KEYSTORE_PASSWORD. Check the password secret and uploaded file."
            exit 1
          fi

          echo "=== Checking requested alias and certificate fingerprint ==="
          if ! keytool -list -v -keystore app/ppa-talk-debug-new.jks -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"; then
            echo "DIAGNOSIS: Keystore opened, but ANDROID_KEY_ALIAS was not found or its entry could not be read."
            exit 1
          fi
          echo "PKCS12 keystore, password, alias, and certificate verified."

      - name: Build debug APK with persistent signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "Missing ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "${ANDROID_KEY_ALIAS:-}" || { echo "Missing ANDROID_KEY_ALIAS" >&2; exit 1; }
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK signing certificate
        run: |
          apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signing certificate
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ppa-talk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
