name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches:
      - feature/chat-voice-video-calling
      - phase-1-final
  pull_request:
    branches:
      - feature/chat-voice-video-calling
      - phase-1-final
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Safely verify repository signing certificate fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Signing secrets missing; fingerprint verification skipped."
            exit 0
          fi
          trap 'rm -f signing-check.jks' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing-check.jks
          keytool -list -v -keystore signing-check.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" 2>/dev/null | awk '/SHA1:|SHA256:/ {print}'
      - name: Run Android lint checks
        run: gradle --no-daemon :app:lintDebug --stacktrace
      - name: Restore signing keystore when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/ppa-talk-debug-new.jks
            chmod 600 app/ppa-talk-debug-new.jks
            keytool -list -keystore app/ppa-talk-debug-new.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "Signing keystore restored."
          else
            echo "Signing secrets unavailable; debug APK will use standard debug signing."
          fi
      - name: Build APKs
        run: |
          set -euo pipefail
          # Always build both APK variants. Release is signed with the configured
          # keystore when available; otherwise Gradle emits an unsigned release APK.
          gradle --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify release APK signature when present
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ -s "$APK" ]; then
            if [ -s app/ppa-talk-debug-new.jks ]; then
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            else
              echo "Release APK exists but is unsigned; signature verification skipped."
            fi
          else
            echo "ERROR: Release APK was not generated."
            exit 1
          fi
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppa-talk-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
