name: PPA Talk Android Build

on:
  push:
    branches:
      - main
      - security/phone-otp-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keep the same debug signing key between CI runs. GitHub caches are
      # best-effort; for production/release signing, use repository secrets.
      - name: Restore persistent debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ppa-talk-debug-keystore-v1

      - name: Create debug keystore if cache is empty
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Restored existing PPA Talk debug keystore."
          fi

      - name: Print Debug Signing Certificate Fingerprints
        run: gradle signingReport --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PPA-Talk-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
