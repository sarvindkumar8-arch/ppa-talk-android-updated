name: PPA Talk Android Build

on:
  push:
    branches:
      - main
      - security/phone-otp-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloud Functions JavaScript
        run: |
          node --check functions/index.js
          node --check functions/migrate-media.js

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # A debug APK must remain buildable even when optional release-signing
      # secrets are missing or malformed. Never publish an unsigned release APK.
      - name: Restore and validate optional release keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_TMP="app/ppa-talk-debug-new.jks.tmp"
          KEYSTORE_FILE="app/ppa-talk-debug-new.jks"
          rm -f "$KEYSTORE_TMP" "$KEYSTORE_FILE"

          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]] &&
             printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_TMP" 2>/dev/null &&
             keytool -list -keystore "$KEYSTORE_TMP" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            mv "$KEYSTORE_TMP" "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Optional release keystore validated."
          else
            rm -f "$KEYSTORE_TMP" "$KEYSTORE_FILE"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are missing or invalid. Debug APK will still be built; release APK will be skipped."
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Custom Signed Release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug and Optional Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: PPA-Talk-Android-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
