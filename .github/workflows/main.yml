name: PPA Talk Android Build

on:
  push:
    branches:
      - main
      - security/phone-otp-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Preferred: encrypted repository secrets. The cache fallback is only
      # for bootstrapping until the owner adds the four signing secrets.
      - name: Restore debug keystore cache (fallback only)
        if: ${{ secrets.DEBUG_KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ppa-talk-debug-keystore-v1

      - name: Configure encrypted signing keystore
        if: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Encrypted repository keystore loaded and validated."

      - name: Create debug keystore if cache is empty
        if: ${{ secrets.DEBUG_KEYSTORE_BASE64 == '' }}
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Restored existing cached PPA Talk debug keystore."
          fi

      - name: Print Debug Signing Certificate Fingerprints
        run: gradle signingReport --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PPA-Talk-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
