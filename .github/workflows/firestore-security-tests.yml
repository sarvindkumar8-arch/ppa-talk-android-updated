name: Firestore and Storage Security Rules Tests

on:
  push:
    branches:
      - feature/chat-voice-video-calling
    paths:
      - 'firestore.rules.example'
      - 'profile-security-tests/**'
      - '.github/workflows/firestore-security-tests.yml'
  pull_request:
    branches:
      - feature/chat-voice-video-calling
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: profile-security-tests/package.json

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install test dependencies
        working-directory: profile-security-tests
        run: npm install --no-audit --no-fund

      - name: Run Firestore and Storage security tests
        working-directory: profile-security-tests
        run: npx --yes firebase-tools emulators:exec --only firestore,storage --project ppa-talk-profile-security-test --config firebase.json "npm run test:all"
