name: Firebase Security Emulator Tests

on:
  push:
    branches:
      - feature/chat-voice-video-calling
      - phase-1-final
    paths:
      - 'firestore.rules.example'
      - 'storage.rules.example'
      - 'functions/**'
      - 'profile-security-tests/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches:
      - feature/chat-voice-video-calling
      - phase-1-final
    paths:
      - 'firestore.rules.example'
      - 'storage.rules.example'
      - 'functions/**'
      - 'profile-security-tests/**'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-security-tests:
    name: Firestore and Storage rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install security test dependencies
        working-directory: profile-security-tests
        run: npm install --no-audit --no-fund

      - name: Check Cloud Functions JavaScript syntax
        run: node --check functions/index.js

      - name: Copy production rules into the emulator project directory
        run: |
          cp firestore.rules.example profile-security-tests/firestore.rules.ci
          cp storage.rules.example profile-security-tests/storage.rules.ci
          cmp -s firestore.rules.example profile-security-tests/firestore.rules.ci
          cmp -s storage.rules.example profile-security-tests/storage.rules.ci

      - name: Run Firestore and Storage Emulator tests against production rules
        run: npx --yes firebase-tools emulators:exec --config profile-security-tests/firebase.json --only firestore,storage --project ppa-talk-profile-security-test "npm --prefix profile-security-tests run test:all"
