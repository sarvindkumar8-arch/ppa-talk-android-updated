name: Firestore Rules Validation

on:
  push:
    branches:
      - security-hardening/profile-media-app-check
    paths:
      - 'firestore.rules.example'
      - 'firebase.json'
      - 'tests/firebase/**'
      - '.github/workflows/firestore-rules-validation.yml'
  workflow_dispatch:

jobs:
  validate-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and test libraries
        run: |
          npm install --global firebase-tools
          npm install --no-save --no-package-lock firebase @firebase/rules-unit-testing

      - name: Run Firestore friend permission tests in Emulator
        run: firebase emulators:exec --only firestore --project demo-ppa-talk "node --test tests/firebase/firestore.rules.test.cjs"
