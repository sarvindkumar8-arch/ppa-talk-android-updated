name: Firebase Security Rules Validation
# Re-run read-only Firebase Rules API permission check after IAM role update

concurrency:
  group: firebase-security-rules-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - security-hardening/profile-media-app-check
    paths:
      - 'firestore.rules.example'
      - 'storage.rules.example'
      - 'firebase.json'
      - 'tests/firebase/**'
      - '.github/workflows/firestore-rules-validation.yml'
  workflow_dispatch:

jobs:
  validate-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI and test libraries
        run: |
          npm install --global firebase-tools
          npm install --no-save --no-package-lock firebase@11.10.0 @firebase/rules-unit-testing@4.0.1

      - name: Run Firestore and Storage permission tests in Emulators
        run: firebase emulators:exec --only firestore,storage --project demo-ppa-talk "node --test tests/firebase/*.test.cjs"

  verify-google-workload-identity:
    if: github.ref == 'refs/heads/security-hardening/profile-media-app-check'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/469604923642/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: ppa-talk-github-security@ppa-talk.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify short-lived service account access token
        run: gcloud auth print-access-token > /dev/null

      - name: Check read-only access to Firebase Rules API
        shell: bash
        run: |
          token="$(gcloud auth print-access-token)"
          status="$(curl --silent --show-error --output /tmp/firebase-rules-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${token}" \
            "https://firebaserules.googleapis.com/v1/projects/ppa-talk/rulesets?pageSize=1")"
          echo "Firebase Rules API HTTP status: ${status}"
          if [ "${status}" = "200" ]; then
            echo "Firebase Rules API read access: PASS"
          elif [ "${status}" = "403" ]; then
            echo "Firebase Rules API read access: FAIL (permission denied)"
            cat /tmp/firebase-rules-response.json
            exit 1
          else
            cat /tmp/firebase-rules-response.json
            exit 1
          fi

      - name: Audit deployed Firestore and Storage rules (read-only)
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          audit_release() {
            local release_id="$1"
            local local_file="$2"
            local label="$3"
            local release_json ruleset_name ruleset_json live_content live_hash repo_hash
            local status
            status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${token}" \
              "https://firebaserules.googleapis.com/v1/projects/ppa-talk/releases/${release_id}")"
            echo "${label} active release HTTP status: ${status}"
            if [ "${status}" = "404" ]; then
              echo "${label}: NO ACTIVE RELEASE FOUND"
              return 0
            fi
            if [ "${status}" != "200" ]; then
              cat /tmp/release.json
              return 1
            fi
            ruleset_name="$(jq -r '.rulesetName // empty' /tmp/release.json)"
            if [ -z "${ruleset_name}" ]; then
              echo "${label}: release has no rulesetName"
              return 1
            fi
            status="$(curl --silent --show-error --output /tmp/ruleset.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${token}" \
              "https://firebaserules.googleapis.com/v1/${ruleset_name}")"
            echo "${label} deployed ruleset HTTP status: ${status}"
            if [ "${status}" != "200" ]; then
              cat /tmp/ruleset.json
              return 1
            fi
            live_content="$(jq -r '.source.files[0].content // empty' /tmp/ruleset.json)"
            if [ -z "${live_content}" ]; then
              echo "${label}: deployed ruleset source is empty or unavailable"
              return 1
            fi
            live_hash="$(printf '%s' "${live_content}" | sha256sum | cut -d' ' -f1)"
            repo_hash="$(sha256sum "${local_file}" | cut -d' ' -f1)"
            echo "${label} deployed SHA256: ${live_hash}"
            echo "${label} repository SHA256: ${repo_hash}"
            if [ "${live_hash}" = "${repo_hash}" ]; then
              echo "${label} LIVE RULES MATCH REPOSITORY: PASS"
            else
              echo "${label} LIVE RULES DIFFER FROM REPOSITORY: REVIEW REQUIRED"
            fi
          }
          audit_release "cloud.firestore" "firestore.rules.example" "Firestore"
          audit_release "firebase.storage" "storage.rules.example" "Storage"
